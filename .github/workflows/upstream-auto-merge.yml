name: Upstream Auto-Merge & Sync

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if no new tag detected'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check-and-merge:
    name: Check Upstream Frizti/Fritchii & Auto-Merge
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      already_synced: ${{ steps.upstream_info.outputs.already_synced }}
      version_num: ${{ steps.upstream_info.outputs.version_num }}
      latest_upstream_tag: ${{ steps.upstream_info.outputs.latest_upstream_tag }}
      merge_status: ${{ steps.do_merge.outputs.merge_status }}
      merged_sha: ${{ steps.push_main.outputs.merged_sha }}

    steps:
      - name: Checkout Yngchii-X3D Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "Yngchii Auto-Sync Bot"
          git config user.email "bot@yngchii.local"

      - name: Fetch Upstream Tags and Commits
        run: |
          git remote add upstream https://github.com/Frizti/Fritchii.git || true
          git fetch upstream --tags --force
          git fetch upstream main:upstream-main || git fetch upstream master:upstream-main || true

      - name: Detect Latest Upstream Version
        id: upstream_info
        run: |
          # Find latest upstream tag matching fritchii-v*
          LATEST_UPSTREAM_TAG=$(git tag -l "fritchii-v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_UPSTREAM_TAG" ]; then
            echo "No fritchii-v* tags found."
            exit 1
          fi
          
          # Extract version number (e.g. 5.6 from fritchii-v5.6)
          VERSION_NUM=${LATEST_UPSTREAM_TAG#fritchii-v}
          TARGET_YNGCHII_TAG="yngchii-v${VERSION_NUM}"
          
          echo "latest_upstream_tag=$LATEST_UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "target_yngchii_tag=$TARGET_YNGCHII_TAG" >> $GITHUB_OUTPUT
          
          # A Yngchii revision such as 5.6.1.1 also satisfies upstream 5.6.
          SYNCED_TAG=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 100 --json tagName |
            jq -r --arg base "$TARGET_YNGCHII_TAG" '
              first(.[].tagName | select(
                . == $base or
                (startswith($base + ".") and (ltrimstr($base + ".") | test("^[0-9]+\\.[0-9]+$")))
              )) // empty')
          if [ "${{ inputs.force_sync }}" != "true" ] &&
             { [ -n "$SYNCED_TAG" ] || git merge-base --is-ancestor "$LATEST_UPSTREAM_TAG" HEAD; }; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "Upstream tag $LATEST_UPSTREAM_TAG is already synced."
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "New upstream release detected: $LATEST_UPSTREAM_TAG -> $TARGET_YNGCHII_TAG"
          fi

      - name: Merge upstream while preserving Yngchii assets
        if: steps.upstream_info.outputs.already_synced == 'false'
        id: do_merge
        env:
          UPSTREAM_TAG: ${{ steps.upstream_info.outputs.latest_upstream_tag }}
          VERSION_NUM: ${{ steps.upstream_info.outputs.version_num }}
        run: |
          YNGCHII_HEAD=$(git rev-parse HEAD)
          git merge --no-ff --no-commit "$UPSTREAM_TAG" ||
            git rev-parse --verify -q MERGE_HEAD >/dev/null
          if ! git rev-parse --verify -q MERGE_HEAD >/dev/null; then
            echo "merge_status=up_to_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preserve the fork's release assets even when upstream changed them cleanly.
          git restore --source="$YNGCHII_HEAD" --staged --worktree -- \
            .github/assets .github/scripts/package_windows.py .github/scripts/patch_exe_icon_inplace.py \
            .github/scripts/sync_release.py .github/workflows/upstream-auto-merge.yml \
            .github/workflows/release-binaries.yml dist/branding/yngchii_logo.png \
            dist/eden.ico dist/fritchii.ico dist/lichii.ico dist/yuzu.ico src/yuzu/fritchii/whats-new.md

          REVIEW_REASON=
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U
            git merge --abort
            REVIEW_HEAD=$(git rev-parse "$UPSTREAM_TAG^{commit}")
            REVIEW_REASON="Upstream changes conflict with Yngchii. Resolve the merge while preserving the fork's branding, proxy and UI."
          else
            if ! git diff --cached --quiet "$YNGCHII_HEAD" -- \
                src/yuzu/fritchii src/yuzu/main_window.cpp src/yuzu/main.ui \
                src/yuzu/about_dialog.cpp src/yuzu/aboutdialog.ui src/frontend_common/update_checker.cpp \
                src/frontend_common/update_checker.h; then
              REVIEW_REASON="Upstream changes touch the UI or updater used by the Yngchii proxy. Review compatibility before merging."
            fi
            git commit -m "chore(sync): merge upstream $UPSTREAM_TAG into Yngchii-X3D"
            REVIEW_HEAD=HEAD
          fi

          if [ -n "$REVIEW_REASON" ]; then
            BRANCH_NAME="sync/upstream-v${VERSION_NUM}"
            OPEN_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')
            if [ -z "$OPEN_PR" ]; then
              if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null; then
                git push origin "$REVIEW_HEAD:refs/heads/$BRANCH_NAME"
              fi
              if ! gh pr create --base main --head "$BRANCH_NAME" \
                --title "Sync upstream $UPSTREAM_TAG into Yngchii-X3D" --body "$REVIEW_REASON"; then
                echo "::warning::Review branch is ready, but GitHub Actions could not create its PR."
                echo "[Open the upstream sync PR](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            echo "merge_status=review" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merge_status=clean" >> "$GITHUB_OUTPUT"

      - name: Record upstream version
        if: steps.do_merge.outputs.merge_status == 'clean'
        run: |
          python3 .github/scripts/sync_release.py "${{ steps.upstream_info.outputs.version_num }}" "${{ steps.upstream_info.outputs.latest_upstream_tag }}"
          git add dist/frizti_version.txt CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): record upstream version ${{ steps.upstream_info.outputs.version_num }}"
          fi

      - name: Push merged source
        if: steps.do_merge.outputs.merge_status == 'clean'
        id: push_main
        run: |
          git push origin HEAD:main
          echo "merged_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package-windows:
    name: Build Windows x64 candidate
    needs: check-and-merge
    if: needs.check-and-merge.outputs.merge_status == 'clean'
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YNGCHII_PACKAGE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-merge.outputs.merged_sha }}

      - name: Install PE resource inspection dependency
        run: python -m pip install pefile

      - name: Package Windows x64 candidate
        run: |
          python .github/scripts/package_windows.py "${{ needs.check-and-merge.outputs.version_num }}" "${{ needs.check-and-merge.outputs.latest_upstream_tag }}" "yngchii-v${{ needs.check-and-merge.outputs.version_num }}"

      - uses: actions/upload-artifact@v4
        with:
          name: yngchii-windows-x64-candidate
          path: Yngchii-X3D-*-Windows-x64.zip
          if-no-files-found: error
