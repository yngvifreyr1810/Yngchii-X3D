name: Upstream Auto-Merge & Sync

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if no new tag detected'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    name: Check Upstream Frizti/Fritchii & Auto-Merge
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      already_synced: ${{ steps.upstream_info.outputs.already_synced }}
      version_num: ${{ steps.upstream_info.outputs.version_num }}
      target_yngchii_tag: ${{ steps.upstream_info.outputs.target_yngchii_tag }}
      latest_upstream_tag: ${{ steps.upstream_info.outputs.latest_upstream_tag }}
      merge_status: ${{ steps.do_merge.outputs.merge_status }}

    steps:
      - name: Checkout Yngchii-X3D Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "Yngchii Auto-Sync Bot"
          git config user.email "bot@yngchii.local"

      - name: Fetch Upstream Tags and Commits
        run: |
          git remote add upstream https://github.com/Frizti/Fritchii.git || true
          git fetch upstream --tags --force
          git fetch upstream main:upstream-main || git fetch upstream master:upstream-main || true

      - name: Detect Latest Upstream Version
        id: upstream_info
        run: |
          # Find latest upstream tag matching fritchii-v*
          LATEST_UPSTREAM_TAG=$(git tag -l "fritchii-v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_UPSTREAM_TAG" ]; then
            echo "No fritchii-v* tags found."
            exit 1
          fi
          
          # Extract version number (e.g. 5.6 from fritchii-v5.6)
          VERSION_NUM=${LATEST_UPSTREAM_TAG#fritchii-v}
          TARGET_YNGCHII_TAG="yngchii-v${VERSION_NUM}"
          
          echo "latest_upstream_tag=$LATEST_UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "target_yngchii_tag=$TARGET_YNGCHII_TAG" >> $GITHUB_OUTPUT
          
          # Check if this release already exists on GitHub
          if gh release view "$TARGET_YNGCHII_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && [ "${{ inputs.force_sync }}" != "true" ]; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "Upstream tag $LATEST_UPSTREAM_TAG is already synced as $TARGET_YNGCHII_TAG on GitHub."
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "New upstream release detected: $LATEST_UPSTREAM_TAG -> $TARGET_YNGCHII_TAG"
          fi

      - name: Perform Auto-Merge
        if: steps.upstream_info.outputs.already_synced == 'false'
        id: do_merge
        run: |
          UPSTREAM_TAG="${{ steps.upstream_info.outputs.latest_upstream_tag }}"
          VERSION_NUM="${{ steps.upstream_info.outputs.version_num }}"
          
          echo "Attempting automated merge of $UPSTREAM_TAG into main..."
          
          # Try automated merge using '-X ours' strategy for conflict-prone branding/icon files
          if git merge -X ours -m "chore(sync): auto-merge upstream $UPSTREAM_TAG into Yngchii-X3D" "$UPSTREAM_TAG"; then
            echo "merge_status=clean" >> $GITHUB_OUTPUT
          else
            echo "Merge conflicts detected. Checking if conflicts are strictly within known branding files..."
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files: $CONFLICT_FILES"
            
            # If conflicts require human review, create automated PR
            git merge --abort
            BRANCH_NAME="sync/upstream-v${VERSION_NUM}"
            git checkout -b "$BRANCH_NAME"
            git merge "$UPSTREAM_TAG" || true
            
            git push origin "$BRANCH_NAME" --force
            gh pr create \
              --repo "${{ github.repository }}" \
              --title "Sync Upstream $UPSTREAM_TAG into Yngchii-X3D" \
              --body "Automated merge detected conflicts requiring review. Please resolve conflicts and merge to trigger the release." \
              --base main \
              --head "$BRANCH_NAME"
            
            echo "merge_status=conflict_pr_created" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Update Version Files, Changelog, and Release Notes
        if: steps.upstream_info.outputs.already_synced == 'false' && steps.do_merge.outputs.merge_status == 'clean'
        run: |
          python3 .github/scripts/sync_release.py "${{ steps.upstream_info.outputs.version_num }}" "${{ steps.upstream_info.outputs.latest_upstream_tag }}"
          git add dist/frizti_version.txt CHANGELOG.md
          git commit --amend --no-edit

      - name: Push Main and Create GitHub Official Release
        if: steps.upstream_info.outputs.already_synced == 'false' && steps.do_merge.outputs.merge_status == 'clean'
        run: |
          VERSION_NUM="${{ steps.upstream_info.outputs.version_num }}"
          TAG_NAME="${{ steps.upstream_info.outputs.target_yngchii_tag }}"
          
          # Push merged commits to main
          git push origin main
          
          # Push tag to origin if not already there (idempotent)
          git tag -a "$TAG_NAME" -m "Release Yngchii-X3D v${VERSION_NUM}" 2>/dev/null || true
          git push origin "$TAG_NAME" || true
          
          # Create Official Release on GitHub (--latest marks it as the official primary release)
          RELEASE_TITLE="Yngchii-X3D v${VERSION_NUM}"
          
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists on GitHub, updating notes..."
            gh release edit "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              --latest
          else
            echo "Creating official release $TAG_NAME on ${{ github.repository }}..."
            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              --latest
          fi

  package-windows:
    name: Package Single Windows x64 Binary
    needs: check-and-merge
    if: needs.check-and-merge.outputs.already_synced == 'false' && needs.check-and-merge.outputs.merge_status == 'clean'
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Yngchii-X3D Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Attach Windows x64 Release Asset
        run: |
          python .github/scripts/package_windows.py "${{ needs.check-and-merge.outputs.version_num }}" "${{ needs.check-and-merge.outputs.latest_upstream_tag }}" "${{ needs.check-and-merge.outputs.target_yngchii_tag }}"
